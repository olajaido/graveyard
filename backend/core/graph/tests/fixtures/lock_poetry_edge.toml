# Synthetic edge-case fixture for parse_poetry_lock (hand-written; no tool produced it).
# Package names and versions are real. It mixes the Poetry < 2.0 `category` field and
# the Poetry >= 2.0 `groups` field in one file, which a single Poetry release never writes.
# `files` lists and the metadata content-hash are omitted on purpose (no hashes were fabricated).

