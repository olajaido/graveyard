openapi: 3.1.0
info:
  title: Graveyard scan API
  version: 0.1.0
  description: >-
    Start a scan of a public GitHub repository and read its results. Source of truth for the
    routes (spec scan-backend, SB-API-7). Errors are RFC 9457 problem+json.
servers:
  - url: /
paths:
  /v1/scans:
    post:
      operationId: createScan
      summary: Start a scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScan"
      responses:
        "202":
          description: Accepted
          headers:
            location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccepted"
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/scans/{scanId}:
    get:
      operationId: getScan
      summary: Status, stage and counts
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: The scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404": {$ref: "#/components/responses/Problem"}
  /v1/scans/{scanId}/graves:
    get:
      operationId: listGraves
      summary: Nodes that are not Alive, highest priority first
      parameters:
        - $ref: "#/components/parameters/ScanId"
        - name: state
          in: query
          description: Comma-separated base states.
          schema: {type: string, examples: ["dead,ailing"]}
        - name: cursed
          in: query
          schema: {type: boolean}
        - name: wounded
          in: query
          schema: {type: boolean}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        "200":
          description: A page of graves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GravePage"
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/scans/{scanId}/graves/{purl}:
    get:
      operationId: getGrave
      summary: Death Certificate of one package
      parameters:
        - $ref: "#/components/parameters/ScanId"
        - name: purl
          in: path
          required: true
          description: Percent-encoded package URL. Greedy path parameter in the gateway.
          schema: {type: string}
      responses:
        "200":
          description: The certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    ScanId:
      name: scanId
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}-[0-9a-f]{16}$"}
  responses:
    Problem:
      description: Problem details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    CreateScan:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: object
          additionalProperties: false
          required: [type, repo]
          properties:
            type: {const: github}
            repo: {type: string, description: owner/name, examples: ["olajaido/haunted-house"]}
            ref: {type: string}
    ScanAccepted:
      type: object
      required: [scanId, status]
      properties:
        scanId: {type: string}
        status: {const: QUEUED}
    Counts:
      type: object
      required: [total, alive, resting, ailing, dead, cursed, wounded, unscored]
      properties:
        total: {type: integer}
        alive: {type: integer}
        resting: {type: integer}
        ailing: {type: integer}
        dead: {type: integer}
        cursed: {type: integer}
        wounded: {type: integer}
        unscored: {type: integer}
    Scan:
      type: object
      required: [scanId, status, stage, source, createdAt, updatedAt, modelVersion, counts, partial, error]
      properties:
        scanId: {type: string}
        status: {enum: [QUEUED, RUNNING, COMPLETE, FAILED]}
        stage: {type: [string, "null"]}
        source: {type: object}
        createdAt: {type: string}
        updatedAt: {type: string}
        modelVersion: {type: [string, "null"]}
        counts: {oneOf: [{$ref: "#/components/schemas/Counts"}, {type: "null"}]}
        partial: {type: boolean}
        error:
          oneOf:
            - type: "null"
            - type: object
              required: [code, title]
              properties:
                code: {type: string}
                title: {type: string}
    GraveSummary:
      type: object
      properties:
        purl: {type: string}
        state: {enum: [alive, resting, ailing, dead, unknown]}
        deadReason: {enum: [declared, score, null]}
        cursed: {type: boolean}
        wounded: {type: boolean}
        mortality: {type: [number, "null"]}
        confidence: {type: [number, "null"]}
        priority: {type: [number, "null"]}
        direct: {type: boolean}
        scope: {enum: [runtime, dev]}
        services: {type: array, items: {type: string}}
        pathCount: {type: integer}
    GravePage:
      type: object
      required: [scanId, total, items, nextCursor]
      properties:
        scanId: {type: string}
        total: {type: integer}
        items: {type: array, items: {$ref: "#/components/schemas/GraveSummary"}}
        nextCursor: {type: [string, "null"]}
    Certificate:
      allOf:
        - $ref: "#/components/schemas/GraveSummary"
        - type: object
          properties:
            confidence: {type: [number, "null"]}
            exposure: {type: [number, "null"]}
            examplePaths: {type: array, items: {type: object}}
            signals: {type: [object, "null"]}
            evidence:
              type: [object, "null"]
              description: Per signal, the raw value, source URL and fetch time.
            contributions: {type: [object, "null"]}
            normalisedRisks: {type: [object, "null"]}
            warnings: {type: array, items: {type: object}}
            asOf: {type: string}
            modelVersion: {type: string}
