[project]
name = "graveyard-backend"
version = "0.1.0"
description = "Graveyard backend: deterministic mortality model and services"
requires-python = "==3.12.*"
dependencies = [
    "packageurl-python==0.17.6",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "types-pyyaml==6.0.12.20261103",
    "pytest-cov==7.0.0",
]

# Not a distributable package; core/ is imported from the backend root.
[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = ["property: Hypothesis property-based tests"]
testpaths = ["core"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core"]
